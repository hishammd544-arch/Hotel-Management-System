<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login page of the Hotel Management System">
  <title>Login | Hotel Management System</title>
  <link rel="stylesheet" href="css/Admin.css">
</head>
<body>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img src="image/hotel logo.png" alt="Hotel Logo">
        <h2>Welcome Back</h2>
        <p>Sign in to Hotel Management System</p>
      </div>

      <div id="loginMessage" class="message"></div>

      <form id="loginForm" onsubmit="return validateLogin()">
        <fieldset>
          <legend>Login Details</legend>
          <table class="form-table">
            <tr>
              <td><label for="username">Username or Email:</label></td>
              <td>
                <input type="text" id="username" placeholder="Enter your username or email">
                <span class="error" id="usernameError"></span>
              </td>
            </tr>
            <tr>
              <td><label for="role">Select Your Role:</label></td>
              <td>
                <select id="role">
                  <option value="">-- Choose Position --</option>
                  <option value="Admin">Admin</option>
                  <option value="Receptionist">Receptionist</option>
                  <option value="Room Service">Room Service</option>
                  <option value="Customer">Customer</option>
                </select>
                <span class="error" id="roleError"></span>
              </td>
            </tr>
            <tr>
              <td><label for="password">Password:</label></td>
              <td>
                <input type="password" id="password" placeholder="Enter your password">
                <span class="error" id="passwordError"></span>
              </td>
            </tr>
            <tr>
              <td>Options:</td>
              <td>
                <div class="auth-options">
                  <label for="remember" class="option-label">
                    <input type="checkbox" id="remember"> Remember Me
                  </label>
                  <a href="Forgetpass.html">Forgot Password?</a>
                </div>
              </td>
            </tr>
          </table>
        </fieldset>

        <div class="auth-actions">
          <input type="submit" class="btn" value="Login">
          <button type="button" class="btn btn-secondary" onclick="resetLoginForm()">Reset</button>
        </div>
      </form>

      <div class="auth-footer-link">
        Don't have an account? <a href="Signin.html">Sign Up</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    &copy; 2026 Hotel Management System &middot; CSC 3215 Web Technologies
  </footer>

  <script src="js/login.js"></script>
  <script src="js/common.js"></script>
  <script src="js/data.js"></script>

</body>
</html>
